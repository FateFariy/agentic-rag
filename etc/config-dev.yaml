Http:
  Name: rag
  Host: 0.0.0.0
  Port: 8080
  Mode: pro
  MaxBytes: 1048576000
  Timeout: 30000

Auth:
  AccessSecret: your-access-secret-key
  AccessExpire: 2h

Mysql:
  Addr: host.docker.internal:3306
  Username: root
  Password: "123456"
  DbName: rag

Redis:
  - Host: host.docker.internal:6379
    Type: node
    Weight: 100

Minio:
  Addr: host.docker.internal:9000
  AccessKeyID: minioadmin
  SecretAccessKey: minioadmin
  BucketName: agent-document
  ObjectPrefix: rag/document
  ParsedTextPrefix: rag/parsed-text
  ParseArtifactPrefix: rag/parse-artifact
  UseSSL: false

Neo4j:
  Enabled: true
  Uri: bolt://127.0.0.1:7687
  Username: neo4j
  Password: neo4j
  Database: neo4j
  QueryTimeoutSeconds: 5

MQ:
  Addr: 10.104.0.165:9876
  ParseTopic: know-agent-parse
  IndexTopic: know-agent-index
  Retry: 3
  Enabled: true

Embedding:
  Model: qwen3-embedding:4b
  Dimensions: 1024
  BaseURL: http://10.104.1.173:11434

Chunk:
  RecursiveMaxChars: 800
  RecursiveOverlapChars: 120
  SemanticMaxChars: 700
  SemanticMinChars: 240
  ParentChunkMaxChars: 2200
  ParentChunkOverlapChars: 180
  ParentSemanticMaxChars: 1600
  ParentSemanticMinChars: 480
  SemanticSimilarityThreshold: 0.18
  LlmEnabled: false
  LlmMaxChars: 3500
  RecommendLlmWhenLowQuality: true

Gse:
  DictPath: ""
  StopPath: ""
  UseHMM: false
  AlphaNum: false

Milvus:
  Addr: host.docker.internal:19530
  Username: ""
  Password: ""
  Collection: document_chunk
  MetricType: COSINE

Chat:
  Memory:
    StrategyType: summary_compression
    RecentTranscriptMaxChars: 1024
    QuestionHistoryMaxChars: 512
    HistorySummary:
      Enabled: true
      HistoryTurns: 6
      KeepRecentTurns: 3
      CompressionBatchTurns: 3
      MaxChars: 1024
      RecentTranscriptMaxChars: 2200
  Rewrite:
    Enabled: true
    Temperature: 0.1
    TopP: 0.3
    Thinking: false
  Recommendation:
    Enabled: true
    Timeout: 5s
    HistoryPreviewTurns: 3
  Rag:
    Enabled: true
    ChannelTimeout: 5s
    SubQuestionTimeout: 12s
    CandidateTopK: 10
    FinalTopK: 5
    ParentEvidenceMaxChars: 1024
    PlanningHistoryMaxChars: 2000
    QuestionHistoryMaxChars: 1000
    TotalEvidenceMaxChars: 5200
    PerSubQuestionEvidenceMaxChars: 2200
    Keyword:
      Enabled: true
      TopK: 8
      RelativeScoreFloor: 0.35
    Vector:
      Enabled: true
      TopK: 8
      MinSimilarity: 0.5
    Table:
      Enabled: true
    GraphRag:
      Enabled: true
      ExtractBatch: 8
      ChunkMaxChars: 1200
      MaxEntities: 300
      MaxRelations: 500
      MaxCommunities: 50
      CommunityTopNodes: 5
      CommunityReportTopN: 12
      LouvainEnabled: true
      LouvainGamma: 1.0
      PageRankDamping: 0.85
      PageRankMaxIter: 30
      SearchMaxHops: 2
      SearchTopK: 10
      TypedChunkProjectionEnabled: true
      TypedCardTopK: 100
    Raptor:
      Enabled: true
      TopK: 5
      SourceChunkTopK: 3
      MaxClusterSize: 6
      MaxLevels: 3
      LlmSummaryEnabled: true
      SummaryQualityFloor: 0.42
    Rerank:
      Enabled: true
      URL:
      ApiKey:
      Model: qwen3-rerank
      TopN: 5
      ConnectTimeout: 3s
      ReadTimeout: 6s
      ScoreThreshold: 0.0
    Hybrid:
      VectorWeight: 1.0
      KeywordWeight: 1.0
      TableWeight: 1.2
      GraphRagWeight: 1.1
      RaptorWeight: 1.05
      RankWeight: 1.0
      OriginalScoreWeight: 0.08
      MetadataBoostWeight: 0.04
      MaxMetadataBoost: 1.0
    GraphRagQueryPlan:
      Enabled: true
    AutoRoute:
      RecommendationThreshold: 0.55
  SemanticCache:
    Enabled: true
    Collection: semantic_cache
    SimilarityThreshold: 0.92
    DirectHitThreshold: 0.90
    RecallTopK: 3
    ConfidenceFloor: 0.6
    JudgeEnabled: false
    JudgeTemperature: 0.1
    ReuseAnswer: true
    WriteTopic: know-agent-semantic-cache-write
  Agent:
    RecommendationEnabled: true
    MaxModelCallsPerRun: 8
    MaxModelCallsPerThread: 40
    MaxToolCallsPerRun: 6
    MaxToolCallsPerThread: 30
    HistoryPreviewTurns: 4
    RecommendationTimeout: 5s
    SystemPrompt: ""
    RecommendationPrompt: ""

ChatModel:
  Ark:
    Function: "chat"
    Model:
    BaseURL:
    ApiKey:
    Temperature: 0.1
    MaxTokens: 1024
    TopP: 0.3
    InputTokenCost1k: 0.0001
    OutputTokenCost1k: 0.0001

JudgeModel:
  Ark:
    Function: "judge"
    Model:
    BaseURL:
    ApiKey:
    Temperature: 0.0
    MaxTokens: 1024
    TopP: 0.3
    InputTokenCost1k: 0.0001
    OutputTokenCost1k: 0.0001